[workspace]
resolver = "2"
members = ["harness"]
# The Safe-PDF checkout under test is its own workspace; the harness reaches its crates by path.
exclude = ["safe-pdf"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
arithmetic_side_effects = "warn"
or_fun_call = "warn"
mut_mut = "warn"
eq_op = "warn"
absurd_extreme_comparisons = "warn"
as_conversions = "warn"
large_enum_variant = "deny"
map_clone = "warn"
unnecessary_to_owned = "warn"
inefficient_to_string = "warn"
clone_on_ref_ptr = "warn"
cmp_owned = "warn"
panic = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

# Symbolized diagnostic workers, including panic traces. Every crate is optimized, Safe-PDF's
# included: generic code is compiled in the crate that instantiates it, so an unoptimized Safe-PDF
# crate would also leave the dependency code it instantiates (a JPEG decoder, say) unoptimized.
# Debug info keeps panic locations and inlined frames in backtraces, and the overflow checks and
# debug assertions inherited from `dev` stay on.
[profile.regression]
inherits = "dev"
opt-level = 3
debug = 2
strip = "none"
panic = "unwind"
