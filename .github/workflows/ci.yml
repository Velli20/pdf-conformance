name: CI

# Builds and lints the harness against Safe-PDF's main branch. Only the harness is linted and
# tested; Safe-PDF's crates are compiled because the harness links them, and the cargo cache
# saved on main keeps that from happening on every run.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the harness
        id: setup
        uses: ./.github/actions/setup
        with:
          safe-pdf-repository: Velli20/safe-pdf
          safe-pdf-sha: main
          cache-key: ci
          pdfium: "false"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Shell scripts
        run: for script in .github/scripts/*.sh; do bash -n "$script"; done

      # Only main saves, so a pull request never writes a cache other branches restore.
      - name: Save cargo cache
        if: github.event_name == 'push' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-primary-key }}

  prune-caches:
    name: Prune old cargo caches
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prune-cargo-cache.sh Linux-ci-
